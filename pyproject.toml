[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aist5040-materials-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.68.0", "httpx>=0.27.0", "python-dotenv>=1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
materials-fixed-screening = "materials_agent.baselines.fixed_screening:main"
materials-openai-agent = "materials_agent.agent.openai_experiment:main"
